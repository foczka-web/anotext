<!DOCTYPE html>
<html lang="pl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mini Messenger</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
font-family:Arial;
background:#111827;
color:white;

}


.app{

height:100vh;
max-width:500px;
margin:auto;
display:flex;
flex-direction:column;

}



.login{

padding:20px;

}



input,button{

padding:14px;
border-radius:20px;
border:0;
font-size:16px;

}



input{

width:100%;
background:#374151;
color:white;
margin:5px 0;

}



button{

background:#2563eb;
color:white;
width:100%;
margin:5px 0;

}



.header{

background:#2563eb;
padding:15px;
font-size:20px;

}



.chat{

flex:1;
overflow-y:auto;
background:#0b1220;
padding:15px;

}



.msg{

padding:12px;
margin:8px 0;
max-width:75%;
border-radius:18px;

}



.mine{

background:#2563eb;
margin-left:auto;

}



.other{

background:#374151;
margin-right:auto;

}



.time{

font-size:11px;
opacity:.7;

}



.bottom{

display:flex;
gap:5px;
padding:10px;
background:#1f2937;

}



.bottom input{

flex:1;

}



.send{

width:55px;

}



</style>

</head>


<body>


<div class="app">



<div id="login" class="login">


<h1>💬 Mini Messenger</h1>


<input id="numer" placeholder="Twój numer">


<button onclick="login()">

Zaloguj

</button>


</div>




<div id="main" style="display:none;height:100%;flex-direction:column">



<div class="header">

💬 <span id="konto"></span>

</div>



<div style="padding:10px;background:#111827">


<input id="odbiorca" placeholder="Numer rozmówcy">


<button onclick="openChat()">

Otwórz rozmowę

</button>


</div>



<div id="chat" class="chat">

</div>




<div class="bottom">


<input id="tekst" placeholder="Napisz wiadomość">


<button class="send" onclick="sendMessage()">

➤

</button>


</div>


</div>



</div>





<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

getDatabase,

ref,

push,

onValue

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





const firebaseConfig = {


apiKey:"AIzaSyA3J98sguMxYYrl9XfsnnjmlTh329f4C7o",

authDomain:"anochat-d527f.firebaseapp.com",

databaseURL:"https://anochat-d527f-default-rtdb.firebaseio.com",

projectId:"anochat-d527f",

storageBucket:"anochat-d527f.firebasestorage.app",

messagingSenderId:"544298917613",

appId:"1:544298917613:web:85fc95a2fce6d6054ff6e4"


};




const app = initializeApp(firebaseConfig);


const db = getDatabase(app);



let user="";

let currentChat="";

let unsubscribe=null;




window.login=function(){


user=document
.getElementById("numer")
.value
.trim();



if(user==""){

alert("Podaj numer");

return;

}



document
.getElementById("login")
.style.display="none";


document
.getElementById("main")
.style.display="flex";


document
.getElementById("konto")
.innerHTML=user;


}






window.openChat=function(){



let other=document
.getElementById("odbiorca")
.value
.trim();



if(other==""){

alert("Podaj numer rozmówcy");

return;

}



// tworzy zawsze ten sam chat dla dwóch osób

currentChat=[user,other]
.sort()
.join("_");



loadMessages();


}






window.sendMessage=function(){



let text=document
.getElementById("tekst")
.value
.trim();



if(!currentChat){

alert("Najpierw otwórz rozmowę");

return;

}



if(text=="")return;



push(

ref(
db,
"chats/"+currentChat+"/messages"
),

{

from:user,

text:text,

time:Date.now()

}


);



document
.getElementById("tekst")
.value="";


}







function loadMessages(){



if(unsubscribe){

unsubscribe();

}



onValue(

ref(
db,
"chats/"+currentChat+"/messages"
),

snap=>{


let html="";



snap.forEach(item=>{


let m=item.val();



html+=`


<div class="msg ${m.from==user?'mine':'other'}">


<b>${m.from}</b><br>

${m.text}


<div class="time">

${new Date(m.time)
.toLocaleTimeString()}

</div>


</div>


`;


});



document
.getElementById("chat")
.innerHTML=html;



let box=document
.getElementById("chat");


box.scrollTop=box.scrollHeight;



});


}






document
.getElementById("tekst")
.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){

sendMessage();

}


});



</script>


</body>
</html>
