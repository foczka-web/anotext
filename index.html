<!DOCTYPE html>
<html lang="pl">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mini Messenger</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
color:white;
height:100vh;
}


.login{

height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
padding:30px;

}


input,button{

padding:14px;
border:none;
border-radius:20px;
font-size:16px;
margin:5px;

}


input{

background:#374151;
color:white;

}


button{

background:#2563eb;
color:white;
cursor:pointer;

}



#messenger{

display:none;
height:100vh;
}



.sidebar{

width:300px;
background:#1f2937;
display:flex;
flex-direction:column;
border-right:1px solid #374151;

}



.logo{

padding:20px;
font-size:24px;
font-weight:bold;

}



.add{

padding:10px;

}



.contacts{

overflow:auto;
flex:1;

}



.contact{

padding:15px;
cursor:pointer;
border-bottom:1px solid #374151;

}


.contact:hover{

background:#374151;

}



.chat{

flex:1;
display:flex;
flex-direction:column;

}



.chat-header{

background:#2563eb;
padding:18px;
font-size:20px;

}



.messages{

flex:1;
overflow:auto;
padding:15px;
background:#0b1220;

}



.message{

max-width:70%;
padding:12px;
border-radius:18px;
margin:8px 0;

}



.mine{

background:#2563eb;
margin-left:auto;

}



.other{

background:#374151;

}



.bottom{

display:flex;
padding:10px;
background:#1f2937;

}



.bottom input{

flex:1;

}



.send{

width:60px;

}




@media(max-width:700px){


.sidebar{

width:40%;

}


.chat{

width:60%;

}


}


</style>


</head>


<body>



<div id="login" class="login">


<h1>💬 Mini Messenger</h1>


<input id="username" placeholder="Twój numer">


<button onclick="login()">

Wejdź

</button>


</div>




<div id="messenger">


<div class="sidebar">


<div class="logo">

💬 Chat

</div>


<div class="add">


<input id="newUser" placeholder="Dodaj osobę">


<button onclick="addContact()">

+

</button>


</div>



<div id="contacts" class="contacts">

</div>



</div>





<div class="chat">


<div id="chatTitle" class="chat-header">

Wybierz rozmowę

</div>



<div id="messages" class="messages">

</div>



<div class="bottom">


<input id="message" placeholder="Napisz wiadomość">


<button class="send" onclick="sendMessage()">

➤

</button>


</div>



</div>



</div>





<script type="module">


import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

getDatabase,

ref,

push,

set,

onValue

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





const firebaseConfig = {


apiKey:"AIzaSyA3J98sguMxYYrl9XfsnnjmlTh329f4C7o",

authDomain:"anochat-d527f.firebaseapp.com",

databaseURL:"https://anochat-d527f-default-rtdb.firebaseio.com",

projectId:"anochat-d527f",

storageBucket:"anochat-d527f.firebasestorage.app",

messagingSenderId:"544298917613",

appId:"1:544298917613:web:85fc95a2fce6d6054ff6e4"


};




const app = initializeApp(firebaseConfig);

const db = getDatabase(app);



let user = "";

let currentChat = "";





window.login = function(){


user = document
.getElementById("username")
.value
.trim();



if(!user){

alert("Podaj numer");

return;

}



document
.getElementById("login")
.style.display="none";



document
.getElementById("messenger")
.style.display="flex";



loadContacts();


}







window.addContact=function(){


let person=document
.getElementById("newUser")
.value
.trim();



if(!person){

return;

}



set(

ref(
db,
"users/"+user+"/contacts/"+person
),

true

);



document
.getElementById("newUser")
.value="";


}







function loadContacts(){


onValue(

ref(
db,
"users/"+user+"/contacts"
),

snap=>{


let html="";


snap.forEach(x=>{


let person=x.key;



html+=`

<div class="contact"

onclick="openChat('${person}')">

👤 ${person}

</div>

`;


});



document
.getElementById("contacts")
.innerHTML=html;



});


}








window.openChat=function(person){



currentChat=[user,person]
.sort()
.join("_");



document
.getElementById("chatTitle")
.innerHTML="👤 "+person;



loadMessages();


}








function loadMessages(){



onValue(

ref(
db,
"chats/"+currentChat+"/messages"
),

snap=>{


let html="";



snap.forEach(x=>{


let m=x.val();



html+=`

<div class="message ${m.from==user?"mine":"other"}">


${m.text}


</div>

`;


});



document
.getElementById("messages")
.innerHTML=html;



let box=document
.getElementById("messages");


box.scrollTop=box.scrollHeight;



});


}








window.sendMessage=function(){



let text=document
.getElementById("message")
.value
.trim();



if(!text){

return;

}



if(!currentChat){

alert("Najpierw wybierz rozmowę");

return;

}




push(

ref(
db,
"chats/"+currentChat+"/messages"
),

{


from:user,

text:text,

time:Date.now()


}

);



document
.getElementById("message")
.value="";


}







document
.getElementById("message")
.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){

sendMessage();

}


});



</script>


</body>

</html>
