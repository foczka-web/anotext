<!DOCTYPE html>
<html lang="pl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mini Messenger</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:#111827;
color:white;
}


.login{
padding:30px;
}


input,button{

padding:14px;
border-radius:20px;
border:0;
font-size:16px;

}


input{

background:#374151;
color:white;
width:100%;
margin:5px 0;

}


button{

background:#2563eb;
color:white;
cursor:pointer;

}


.app{

display:none;
height:100vh;
}


.sidebar{

width:35%;
background:#1f2937;
border-right:1px solid #374151;
padding:10px;

}


.title{

font-size:22px;
font-weight:bold;
padding:10px;

}


.contact{

background:#374151;
padding:12px;
margin:5px 0;
border-radius:15px;
cursor:pointer;

}



.chat{

width:65%;
display:flex;
flex-direction:column;

}


.header{

background:#2563eb;
padding:15px;
font-size:20px;

}



.messages{

flex:1;
overflow-y:auto;
padding:15px;
background:#0b1220;

}



.msg{

padding:10px 15px;
margin:8px;
border-radius:18px;
max-width:70%;

}


.mine{

background:#2563eb;
margin-left:auto;

}


.other{

background:#374151;

}



.bottom{

display:flex;
padding:10px;
gap:5px;
background:#1f2937;

}


.bottom input{

flex:1;

}


.send{

width:60px;

}



@media(max-width:700px){

.sidebar{

width:40%;

}

.chat{

width:60%;

}

}

</style>

</head>


<body>


<div id="login" class="login">


<h1>💬 Messenger</h1>


<input id="myNumber" placeholder="Twój numer">


<button onclick="start()">

Wejdź

</button>


</div>





<div id="app" class="app">


<div class="sidebar">


<div class="title">

Rozmowy

</div>



<input id="newContact" placeholder="Numer osoby">


<button onclick="addContact()">

Dodaj

</button>



<div id="contacts">

</div>


</div>





<div class="chat">


<div class="header">

<span id="chatName">

Wybierz rozmowę

</span>

</div>



<div id="messages" class="messages">

</div>



<div class="bottom">


<input id="text" placeholder="Napisz wiadomość">


<button class="send" onclick="send()">

➤

</button>


</div>


</div>



</div>






<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

getDatabase,

ref,

push,

set,

onValue

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyA3J98sguMxYYrl9XfsnnjmlTh329f4C7o",

authDomain:"anochat-d527f.firebaseapp.com",

databaseURL:"https://anochat-d527f-default-rtdb.firebaseio.com",

projectId:"anochat-d527f",

storageBucket:"anochat-d527f.firebasestorage.app",

messagingSenderId:"544298917613",

appId:"1:544298917613:web:85fc95a2fce6d6054ff6e4"


};



const app=initializeApp(firebaseConfig);


const db=getDatabase(app);



let user="";

let current="";

let contacts=[];





window.start=function(){


user=document.getElementById("myNumber").value.trim();



if(!user){

alert("Podaj numer");

return;

}



document.getElementById("login").style.display="none";


document.getElementById("app").style.display="flex";



loadContacts();


}







function loadContacts(){


onValue(ref(db,"users/"+user+"/contacts"),snap=>{


let html="";


contacts=[];


snap.forEach(x=>{


let name=x.val();


contacts.push(name);


html+=`

<div class="contact"
onclick="openChat('${name}')">

👤 ${name}

</div>

`;



});



document.getElementById("contacts").innerHTML=html;



});


}






window.addContact=function(){


let name=document
.getElementById("newContact")
.value
.trim();



if(!name)return;



set(

ref(
db,
"users/"+user+"/contacts/"+name
),

name

);



document.getElementById("newContact").value="";


}








window.openChat=function(person){


current=[user,person]
.sort()
.join("_");



document.getElementById("chatName").innerHTML=

"👤 "+person;



loadMessages();


}







function loadMessages(){


onValue(

ref(
db,
"chats/"+current
),

snap=>{


let html="";


snap.forEach(x=>{


let m=x.val();


html+=`

<div class="msg ${m.from==user?'mine':'other'}">

${m.text}

</div>

`;



});


document.getElementById("messages").innerHTML=html;


let box=document.getElementById("messages");

box.scrollTop=box.scrollHeight;


});


}






window.send=function(){


let text=document
.getElementById("text")
.value
.trim();



if(!text || !current)return;



push(

ref(
db,
"chats/"+current
),

{

from:user,

text:text,

time:Date.now()

}

);



document.getElementById("text").value="";


}






document
.getElementById("text")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter")send();

});


</script>


</body>
</html>
