<!DOCTYPE html>
<html lang="pl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mini Messenger</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:#111827;
color:white;
height:100vh;
display:flex;
justify-content:center;
}


.container{
width:100%;
max-width:500px;
height:100vh;
display:flex;
flex-direction:column;
}


.login{
padding:20px;
}


input,button{

width:100%;
padding:15px;
margin:5px 0;

border-radius:20px;
border:0;

font-size:16px;

}


button{

background:#2563eb;
color:white;

}



.header{

background:#2563eb;
padding:15px;
font-size:20px;
font-weight:bold;

}



.chat{

flex:1;
overflow-y:auto;
padding:15px;

background:#0f172a;

}



.msg{

max-width:75%;
padding:12px;
margin:8px 0;

border-radius:18px;

word-wrap:break-word;

}



.me{

background:#2563eb;
margin-left:auto;

}



.other{

background:#374151;
margin-right:auto;

}



.time{

font-size:10px;
opacity:.7;
margin-top:5px;

}



.bottom{

padding:10px;
background:#1f2937;

display:flex;
gap:5px;

}


.bottom input{

margin:0;

}



.send{

width:60px;
border-radius:50%;

}



</style>

</head>


<body>


<div class="container">


<div id="login" class="login">


<h1>💬 Mini Messenger</h1>


<input id="numer" placeholder="Twój numer">


<button onclick="start()">
Zaloguj
</button>


</div>




<div id="app" style="display:none;height:100%;flex-direction:column">


<div class="header">

💬 <span id="konto"></span>

</div>



<div id="wiadomosci" class="chat">

</div>



<div class="bottom">


<input id="tekst" placeholder="Napisz wiadomość">


<button class="send" onclick="send()">
➤
</button>


</div>



</div>


</div>





<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {

getDatabase,

ref,

push,

onValue

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





const firebaseConfig = {

apiKey:"AIzaSyA3J98sguMxYYrl9XfsnnjmlTh329f4C7o",

authDomain:"anochat-d527f.firebaseapp.com",

databaseURL:"https://anochat-d527f-default-rtdb.firebaseio.com",

projectId:"anochat-d527f",

storageBucket:"anochat-d527f.firebasestorage.app",

messagingSenderId:"544298917613",

appId:"1:544298917613:web:85fc95a2fce6d6054ff6e4"

};



const app = initializeApp(firebaseConfig);


const db=getDatabase(app);



let user="";





window.start=function(){


user=document.getElementById("numer").value;


if(!user){

alert("Podaj numer");

return;

}



document.getElementById("login").style.display="none";


document.getElementById("app").style.display="flex";


document.getElementById("konto").innerHTML=user;


listen();


}






window.send=function(){


let text=document.getElementById("tekst").value.trim();


if(!text)return;



push(ref(db,"messages"),{


from:user,


text:text,


time:Date.now()


});



document.getElementById("tekst").value="";


}






document.getElementById("tekst")

.addEventListener("keydown",e=>{


if(e.key==="Enter"){

send();

}


});







function listen(){


onValue(ref(db,"messages"),snap=>{


let html="";


snap.forEach(x=>{


let m=x.val();



let godzina=

new Date(m.time)

.toLocaleTimeString([],{

hour:"2-digit",

minute:"2-digit"

});




html+=`

<div class="msg ${m.from==user?'me':'other'}">

<b>${m.from}</b><br>

${m.text}


<div class="time">

${godzina}

</div>


</div>


`;



});



let box=document.getElementById("wiadomosci");


box.innerHTML=html;


box.scrollTop=box.scrollHeight;



});

}



</script>


</body>

</html>
