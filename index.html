<!DOCTYPE html> <html lang="pl"> <head> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Mini Messenger</title> <style> *{ box-sizing:border-box; } body{ margin:0; font-family:Arial,sans-serif; background:#111827; color:white; height:100vh; } .login{ height:100vh; display:flex; flex-direction:column; justify-content:center; padding:30px; } input,button{ padding:14px; border:none; border-radius:20px; font-size:16px; margin:5px; } input{ background:#374151; color:white; } button{ background:#2563eb; color:white; cursor:pointer; } #messenger{ display:none; height:100vh; } .sidebar{ width:300px; background:#1f2937; display:flex; flex-direction:column; border-right:1px solid #374151; } .logo{ padding:20px; font-size:24px; font-weight:bold; } .add{ padding:10px; } .contacts{ overflow:auto; flex:1; } .contact{ padding:15px; cursor:pointer; border-bottom:1px solid #374151; } .contact:hover{ background:#374151; } .chat{ flex:1; display:flex; flex-direction:column; } .chat-header{ background:#2563eb; padding:18px; font-size:20px; } .messages{ flex:1; overflow:auto; padding:15px; background:#0b1220; } .message{ max-width:70%; padding:12px; border-radius:18px; margin:8px 0; } .mine{ background:#2563eb; margin-left:auto; } .other{ background:#374151; } .bottom{ display:flex; padding:10px; background:#1f2937; } .bottom input{ flex:1; } .send{ width:60px; } @media(max-width:700px){ .sidebar{ width:40%; } .chat{ width:60%; } } 💬 Mini Messenger Wejdź 💬 Chat + Wybierz rozmowę ➤
